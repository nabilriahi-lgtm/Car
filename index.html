<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Car Brands Mobile</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#111827}
header{background:#111827;color:#fff;text-align:center;padding:22px 14px 18px}h1{margin:0 0 6px;font-size:30px}header p{margin:0;color:#cbd5e1}
#gate{position:sticky;top:0;z-index:20;padding:10px;background:rgba(246,247,251,.96);backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb}
#gate button{width:100%;border:0;border-radius:14px;padding:15px;background:#2563eb;color:#fff;font-weight:800;font-size:17px}
#gate button.ok{background:#16a34a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
.card{border:1px solid #e5e7eb;background:#fff;border-radius:18px;min-height:136px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.97);background:#eff6ff}.logo{height:64px;display:flex;align-items:center;justify-content:center}.logo img{max-width:62px;max-height:62px}
.mono{width:62px;height:62px;border-radius:17px;background:#eef2ff;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.name{font-size:14px;font-weight:800;text-align:center}.listen{font-size:12px;color:#2563eb;font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:999px;opacity:0;transition:.2s;z-index:99;font-weight:700;white-space:nowrap}
#toast.show{opacity:1}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);max-width:1100px;margin:auto}}
</style></head><body>

function voices(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||vs[0]||null}
voices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=voices;
function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove('show'),900)}
unlock.onclick=()=>{if(!('speechSynthesis'in window)){unlock.textContent='❌ Ouvre dans Safari';return}voices();let u=new SpeechSynthesisUtterance('Ready');u.lang=voice?.lang||'en-US';if(voice)u.voice=voice;u.volume=.05;speechSynthesis.cancel();speechSynthesis.speak(u);enabled=true;unlock.textContent='✅ Son activé';unlock.classList.add('ok');msg('Son activé')};
